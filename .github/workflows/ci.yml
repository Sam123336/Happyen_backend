name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait postgres
      - run: docker compose exec -T postgres psql -U happyn -d happyn -c "SELECT PostGIS_Version();"
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://happyn:happyn@localhost:55432/happyn
      # Every integration test, not one named file: the list went stale as
      # soon as a second repository had one.
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://happyn:happyn@localhost:55432/happyn
      - if: always()
        run: docker compose down --volumes

  # Vercel deploys from its own Git integration. This job only advances the
  # Supabase schema, and is skipped until SUPABASE_DIRECT_URL is configured.
  migrate:
    if: github.ref == 'refs/heads/main'
    needs: [checks, database]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
      DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to Supabase
        if: env.DIRECT_URL != ''
        run: pnpm db:migrate
